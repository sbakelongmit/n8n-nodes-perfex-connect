name: Publish to npm

# Trusted publishing (OIDC): no npm token. Each release is staged on npm and
# goes public after the owner approves it under npmjs.com › Staged Packages (2FA).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - run: npm --version
      - run: npm stage publish --access public
